[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "films-to-fly-to"
version = "0.1.0"
description = "Rank in-flight films for your BA flight"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
films-to-fly-to = "films_to_fly_to.cli:main"
catalog-snapshot = "films_to_fly_to.cli_snapshot:main"
catalog-diff = "films_to_fly_to.cli_diff:main"
build-static = "films_to_fly_to.static_site:main"

[tool.hatch.build.targets.wheel]
packages = ["src/films_to_fly_to"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
