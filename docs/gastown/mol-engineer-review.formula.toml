description = """
Engineer review loop — gate on Architect decompositions (ftft-yjf).

The Engineer is the adversarial reviewer of the Architect's work. Its ONLY job
is to decide, per parent bead in arch:pending-review: could a polecat execute
every child leaf without asking a single question? If yes → approve and tell the
Mayor to sling. If no → bounce back with specific, itemised feedback. The author
(Architect) never blesses its own work; this role is the gate, the same way the
Witness/Refinery gates polecat code.

Async by design: the Engineer naturally lags the Architect by a cycle. All
durable state is labels/notes on the PARENT bead — nothing lives in-session.

## State machine (labels on the PARENT bead)

  arch:pending-review     awaiting this Engineer
  arch:changes-requested  bounced; Architect must iterate (feedback on parent)
  arch:approved           passed; leaves set ready; Mayor told to sling
  arch:escalated          round 3 still failing; human (Mayor) must intervene

Round count: arch:round:N on the parent. Max 3 rounds, then escalate.

## Principles

- Be a sceptic. Default to bouncing when unsure — a vague leaf wastes a whole
  polecat session, a bounce costs one cycle.
- Beads over mail: feedback is persisted on the parent via --design; a nudge is
  the doorbell. Mail (durable) is used only for Mayor-facing READY_TO_SLING and
  ESCALATED signals.
- Discovery over tracking: reconstruct all state from bd list --label arch:* .
"""

[[steps]]
id = 'find-pending'
title = 'Find decompositions awaiting review'
description = """
List parent beads the Architect has submitted:
```bash
bd list --label arch:pending-review --status=open --json
```

If none, skip to loop-or-exit (nothing to review this cycle).

Process them oldest-first (fairness — don't starve an early submission).
For each, load the parent and ALL its leaf children:
```bash
bd show <parent>                                  # description + Architect notes
bd list --label arch:leaf --json | <filter to children depending on this parent>
```
"""

[[steps]]
id = 'grade'
title = 'Grade each leaf against the executability checklist'
needs = ['find-pending']
description = """
For the current parent, grade EVERY leaf against:

1. SMALL ENOUGH — estimate <= 2h of polecat work. Reject if a leaf is really
   several tasks wearing a trench coat.
2. CLEAR ENOUGH — a polecat could execute it with ZERO clarifying questions.
   Reject "implement the thing", "improve X", anything assuming unstated context.
3. TESTABLE — acceptance criteria are objectively verifiable (a test, a command,
   an observable behaviour), not "works well" / "is fast".
4. COMPLETE — the leaves TOGETHER actually satisfy the parent. Reject if there's
   an obvious gap (no tests, missing wiring, a sub-goal dropped).
5. DEPENDENCIES SANE — `bd blocked` shows the intended order; deps point the
   right way (X needs Y, not temporal "X before Y").

Record a per-leaf verdict. The parent PASSES only if every leaf passes all five.
"""

[[steps]]
id = 'decide'
title = 'Approve, bounce, or escalate'
needs = ['grade']
description = """
## If the parent PASSES

Set all leaves ready and approve the parent:
```bash
bd update <leaf> --status=open --labels arch:leaf,ready    # for each leaf
bd update <parent> --labels arch:approved
# (remove arch:pending-review)
```
Tell the Mayor to sling (durable mail — must survive session death):
```bash
gt mail send mayor/ -s "READY_TO_SLING: <parent>" -m "Approved decomposition of <parent>.
Leaf beads ready to sling (with suggested model):
- <leaf-id> — <title> — est <=2h — suggest claude-sonnet
- ...
"
```

## If the parent FAILS and round < 3

Persist itemised feedback ON THE PARENT (durable source of truth):
```bash
bd update <parent> --design "ROUND <N> FEEDBACK (changes requested):
- <leaf-id>: TOO LARGE — split into <suggestion>
- <leaf-id>: TOO VAGUE — needs <missing context>
- <leaf-id>: UNTESTABLE — acceptance criteria must be <verifiable form>
- COMPLETENESS: <gap> not covered by any leaf
"
bd update <parent> --labels arch:changes-requested
# (remove arch:pending-review)
```
Doorbell the Architect (cheap nudge — content is on the bead):
```bash
gt nudge films_to_fly_to/architect "Changes requested on <parent> (round <N>) — see --design feedback"
```

## If the parent FAILS and round == 3

Stop the ping-pong; hand to a human:
```bash
bd update <parent> --labels arch:escalated
gt mail send mayor/ -s "ESCALATED: <parent> failed 3 decomposition rounds" -m "Parent <parent> still not executable after 3 Architect/Engineer rounds.
Persistent issues: <summary>.
Needs human decision: re-scope, split differently, or drop.
"
```
"""

[[steps]]
id = 'loop-or-exit'
title = 'Await beads activity, then loop or hand off'
needs = ['decide']
description = """
End of cycle.

If context LOW — await activity with backoff:
```bash
gt mol step await-signal --agent-bead ftft-films_to_fly_to-engineer \\
  --backoff-base 60s --backoff-mult 2 --backoff-max 1h
```
On signal (e.g. Architect submitted a new arch:pending-review): reset idle and
start the next cycle. On timeout: next cycle runs abbreviated (skip work if no
pending-review beads exist).

If context HIGH — hand off; state is fully reconstructable from beads:
```bash
gt handoff -s "Engineer review handoff" -m "Pending review: <ids>. Approved this session: <ids>. Escalated: <ids>."
```

Never leave the session idle without awaiting or handing off.
"""
